name: Build and release Windows Desktop

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Halla-WebRTC-Builds release tag
        required: true
        default: v0.1.14
  push:
    tags: ['v*', 'desktop-webrtc-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      SDK_VERSION: ${{ inputs.sdk_version || 'v0.1.14' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION=$version" }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $expected = @("v$version", "desktop-webrtc-v$version")
            if ($expected -notcontains '${{ github.ref_name }}') {
              throw "Tag ${{ github.ref_name }} does not match VERSION=$version"
            }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Validate repository policy
        run: python tests/repo_sanity.py

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Qt MSVC
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtspeech
          cache: true

      - name: Install native dependencies
        shell: pwsh
        run: vcpkg install opus:x64-windows openssl:x64-windows

      - name: Download and verify WebRTC SDK
        shell: pwsh
        run: |
          $base = "https://github.com/GroupHalla/Halla-WebRTC-Builds/releases/download/$env:SDK_VERSION/halla-webrtc-windows-x64-$env:SDK_VERSION.zip"
          Invoke-WebRequest -Uri $base -OutFile webrtc-sdk.zip
          Invoke-WebRequest -Uri "$base.sha256" -OutFile webrtc-sdk.zip.sha256
          $expected = ((Get-Content webrtc-sdk.zip.sha256 -Raw) -split '\s+')[0].ToLower()
          $actual = (Get-FileHash webrtc-sdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "WebRTC SDK SHA-256 mismatch" }
          New-Item -ItemType Directory -Force third_party\webrtc-sdk | Out-Null
          Expand-Archive webrtc-sdk.zip -DestinationPath third_party\webrtc-sdk -Force
          $manifest = "third_party\webrtc-sdk\MANIFEST.sha256"
          if (!(Test-Path $manifest)) { throw "SDK manifest missing" }
          foreach ($line in Get-Content $manifest) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed SDK manifest line: $line" }
            $file = Join-Path "third_party\webrtc-sdk" $Matches[2]
            if (!(Test-Path $file)) { throw "SDK file missing: $file" }
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "SDK file hash mismatch: $file" }
          }

      - name: Configure native WebRTC build
        shell: pwsh
        run: |
          cmake -S . -B build-msvc-webrtc -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DHALLA_WEBRTC_SDK_DIR="$pwd\third_party\webrtc-sdk" `
            -DHALLA_ENABLE_WEBRTC_NATIVE=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-msvc-webrtc --verbose

      # Gate de release para a identidade Ed25519: roda a sequência exata de
      # IdentityDialog.cpp (keygen → SPKI DER → seed crua → assinatura) no
      # mesmo ambiente misto do app (headers OpenSSL 3 do vcpkg + BoringSSL
      # do webrtc.lib). Se este passo falhar, o instalador NÃO é publicado —
      # é o que impede um regression como o do ID único vazio (v1.1.0/v1.1.1).
      - name: Ed25519 identity smoke (release gate)
        shell: pwsh
        run: |
          $libs = Get-ChildItem "third_party\webrtc-sdk\lib\windows-x64" -Filter *.lib | ForEach-Object { $_.FullName }
          cl /nologo /std:c++20 /MD /EHsc /DWEBRTC_WIN=1 /DNOMINMAX /DWIN32_LEAN_AND_MEAN `
            /I "C:\vcpkg\installed\x64-windows\include" `
            /I "third_party\webrtc-sdk\include" /I "third_party\webrtc-sdk\include\third_party\abseil-cpp" /I "third_party\webrtc-sdk\include\third_party\libyuv\include" `
            tests\ed25519_identity_smoke.cpp /link $libs ws2_32.lib winmm.lib secur32.lib crypt32.lib iphlpapi.lib dmoguids.lib strmiids.lib msdmo.lib wmcodecdspuuid.lib ole32.lib oleaut32.lib user32.lib advapi32.lib /out:ed25519_identity_smoke.exe
          .\ed25519_identity_smoke.exe

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Halla | Out-Null
          Copy-Item build-msvc-webrtc\Halla.exe dist\Halla\
          $deploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $deploy --release --no-translations --dir dist\Halla dist\Halla\Halla.exe
          Copy-Item packaging\LEIA-ME.txt, packaging\LICENSE.txt dist\Halla\
          $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Filter vc_redist.x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($redist) { Copy-Item $redist.FullName dist\Halla\vc_redist.x64.exe }

      - name: Sign application when certificate is configured
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:PFX) { Write-Host "Signing certificate not configured; manual artifact remains unsigned"; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\halla-signing.pfx", [Convert]::FromBase64String($env:PFX))
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          signtool sign /fd SHA256 /td SHA256 /tr $timestamp /f "$env:RUNNER_TEMP\halla-signing.pfx" /p "$env:PASSWORD" dist\Halla\Halla.exe
          signtool verify /pa /v dist\Halla\Halla.exe

      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $version = '${{ steps.version.outputs.value }}'
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$version" packaging\halla-setup.nsi

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:PFX) { Write-Host "Signing certificate not configured; manual installer remains unsigned"; exit 0 }
          $version = '${{ steps.version.outputs.value }}'
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          signtool sign /fd SHA256 /td SHA256 /tr $timestamp /f "$env:RUNNER_TEMP\halla-signing.pfx" /p "$env:PASSWORD" "Halla-Setup-$version.exe"
          signtool verify /pa /v "Halla-Setup-$version.exe"

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $file = "Halla-Setup-$version.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content -Encoding ascii "$file.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halla-desktop-webrtc-installer
          if-no-files-found: error
          path: |
            Halla-Setup-${{ steps.version.outputs.value }}.exe
            Halla-Setup-${{ steps.version.outputs.value }}.exe.sha256

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: halla-desktop-webrtc-installer
      - name: Publish signed release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Halla-Setup-*.exe
            Halla-Setup-*.exe.sha256
