name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-speech

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="/mingw64" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Prepare Distribution
        shell: msys2 {0}
        run: |
          mkdir -p dist/Halla
          cp build/Halla.exe dist/Halla/
          
          # Deploy Qt dependencies using MSYS2's native windeployqt
          windeployqt --release --no-translations --no-compiler-runtime --dir dist/Halla dist/Halla/Halla.exe
          
          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/Halla/
          cp /mingw64/bin/libstdc++-6.dll dist/Halla/
          cp /mingw64/bin/libwinpthread-1.dll dist/Halla/
          
          # Recursively resolve and copy ALL DLL dependencies from /mingw64/bin!
          # This guarantees libbrotlidec, zlib1, libb2, libicuin, and any other system-provided libraries are included!
          echo ">> Resolvendo e copiando dependências recursivas de DLLs do sistema..."
          COPIED=true
          while [ "$COPIED" = true ]; do
            COPIED=false
            for f in $(find dist/Halla -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dep in $(ldd "$f" | grep -i "mingw" | awk '{print $3}'); do
                if [ ! -z "$dep" ]; then
                  dep_unix=$(cygpath -u "$dep" 2>/dev/null || echo "$dep")
                  dep_name=$(basename "$dep_unix")
                  if [ ! -f "dist/Halla/$dep_name" ] && [ -f "$dep_unix" ]; then
                    echo "Copiando dependência encontrada: $dep_name de $dep_unix"
                    cp "$dep_unix" dist/Halla/
                    COPIED=true
                  fi
                fi
              done
            done
          done
          
          # Copy Readme and License
          cp packaging/LEIA-ME.txt dist/Halla/
          cp packaging/LICENSE.txt dist/Halla/

      - name: Install NSIS
        run: choco install nsis

      - name: Build Installer with NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging/halla-setup.nsi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.13.8
          name: Halla v3.13.8
          draft: false
          prerelease: false
          files: Halla-Setup-3.13.8.exe
          body: |
            ## 🚀 Novidades e Correções do Halla v3.13.8

            Esta release traz a paridade definitiva e a captura direta de teclas de atalho e botões do mouse sem modais (removendo qualquer risco de congelamento), além de uma limpeza completa de referências a softwares terceiros em toda a base de código e documentação!

            ### 🖱️ Captura Direct-Inline Inteligente de Botões Laterais do Mouse (Mouse 4/5/Meio)
            * **Fim das Modais e Hooks de Travamento:** Removemos o mini-menu dialog e todos os hooks globais de baixo nível de teclado e mouse que causavam conflitos com o loop de mensagens em algumas instalações do Windows, eliminando 100% qualquer travamento ou congelamento (freeze/crash)!
            * **Instalação do Hook de Mouse Nativizado:** Agora, o Hook de Mouse nativo do Windows (`WH_MOUSE_LL`) é ativado diretamente e unicamente enquanto o widget `HotkeyEdit` está focado/armado de forma inline, capturando de forma ultra leve cliques de `Mouse 4`, `Mouse 5` e `MouseMeio`.
            * **Foco Snappy e Desarme:** Basta clicar no campo de texto para focá-lo/armá-lo, clicar com o botão lateral do mouse e a captura é realizada instantaneamente, chamando `clearFocus()` para desarmar o widget na hora sem causar navegação ou perda de foco indesejada!

            ### 🧹 Revisão Completa da Marca e Referências
            * **Limpeza Geral:** Realizamos uma varredura completa em toda a base de código, cabeçalhos, arquivos de recursos do Windows (`.rc`), scripts de instalação e documentação, removendo qualquer menção ou referência a softwares de terceiros (como TeamSpeak, Mumble ou suas siglas). O aplicativo agora possui sua identidade visual e textual limpa e profissional como um produto 100% autônomo e de desenvolvimento exclusivo!

            ### 🎨 Barra de Ferramentas e UI no Padrão Clássico Flat
            * Botões com dropdown se auto-ajustam ao tamanho do ícone + seta com espaçamento elegante.
            * O efeito visual de hover e o clique cobrem todo o botão como um bloco sólido indivisível.
            * Separadores 3D etched independentes que separam visualmente os grupos de botões.

            ### 🎙️ Outras Melhorias Robustas
            * **Círculo Verde de Fala Instantâneo:** O indicador de fala responde 100% à tecla de PTT do usuário sem sofrer atrasos ou ficar "preso" por ecos de rede do servidor.
            * **Mapeamento de Hardware de Áudio:** Menus de captura e reprodução totalmente habilitados, permitindo que você selecione e alterne microfones e headsets de verdade!
            * **Atualização Automática:** O aplicativo busca atualizações silenciosamente no GitHub e atualiza a si mesmo de forma autônoma com barra de progresso!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
