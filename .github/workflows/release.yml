name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-speech

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="/mingw64" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Prepare Distribution
        shell: msys2 {0}
        run: |
          mkdir -p dist/Halla
          cp build/Halla.exe dist/Halla/
          
          # Deploy Qt dependencies using MSYS2's native windeployqt
          windeployqt --release --no-translations --no-compiler-runtime --dir dist/Halla dist/Halla/Halla.exe
          
          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/Halla/
          cp /mingw64/bin/libstdc++-6.dll dist/Halla/
          cp /mingw64/bin/libwinpthread-1.dll dist/Halla/
          
          # Recursively resolve and copy ALL DLL dependencies from /mingw64/bin!
          # This guarantees libbrotlidec, zlib1, libb2, libicuin, and any other system-provided libraries are included!
          echo ">> Resolvendo e copiando dependências recursivas de DLLs do sistema..."
          COPIED=true
          while [ "$COPIED" = true ]; do
            COPIED=false
            for f in $(find dist/Halla -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dep in $(ldd "$f" | grep -i "mingw" | awk '{print $3}'); do
                if [ ! -z "$dep" ]; then
                  dep_unix=$(cygpath -u "$dep" 2>/dev/null || echo "$dep")
                  dep_name=$(basename "$dep_unix")
                  if [ ! -f "dist/Halla/$dep_name" ] && [ -f "$dep_unix" ]; then
                    echo "Copiando dependência encontrada: $dep_name de $dep_unix"
                    cp "$dep_unix" dist/Halla/
                    COPIED=true
                  fi
                fi
              done
            done
          done
          
          # Copy Readme and License
          cp packaging/LEIA-ME.txt dist/Halla/
          cp packaging/LICENSE.txt dist/Halla/

      - name: Install NSIS
        run: choco install nsis

      - name: Build Installer with NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging/halla-setup.nsi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.13.13
          name: Halla v3.13.13 — Múltiplos Distintivos e Ordenação Hierárquica de Cargos
          draft: false
          prerelease: false
          files: Halla-Setup-3.13.13.exe
          body: |
            ## 🚀 Novidades e Correções do Halla v3.13.13

            Esta release traz o suporte a múltiplos distintivos visuais (badges/emojis) para cargos e ordenação hierárquica automática dos usuários na lista de conectados!

            ### 🏷️ Múltiplos Distintivos e Ícones de Cargos (Item 9)
            * **Múltiplos Cargos por Usuário:** Agora, se um usuário tiver múltiplos cargos (definidos por strings de ícones/emojis separadas por vírgula no servidor), o cliente renderiza cada um deles sequencialmente após o apelido do usuário na lista.
            * **Badges Customizadas Automáticas:** Cargos em forma de texto viram badges coloridas e estilizadas com a primeira letra maiúscula do cargo em fundo colorido dinâmico, simulando o visual clássico do TeamSpeak 3 / Discord!

            ### 📊 Ordenação Hierárquica Automática (Item 11)
            * **Ordenação de Conectados:** Os usuários de um canal agora são classificados de forma inteligente: membros com maior prioridade hierárquica (menor valor numérico de `order`) ficam posicionados no topo do canal, e em caso de empate, são ordenados de forma alfabética.

            Esta release consolida o suporte completo a canais visuais Spacers e siglas de cargos integradas com o Halla Server v3.2.1, além do suporte a múltiplos idiomas com detecção automática e fechamento imediato para atualizações automáticas!

            ### 🎨 Canais "Spacers" Visuais (Organização de Servidor)
            * **Organização Visual:** O Halla agora interpreta e renderiza perfeitamente canais fictícios com padrões como `[spacer0]`, `[cspacer123]` ou `[*spacerA]` (estilo linhas e textos centralizados do TeamSpeak 3)!
              - **Spacers Normais:** Ocultam o ícone de canal padrão e exibem o texto formatado.
              - **Spacers Centralizados (`cspacer`):** Centralizam o texto do canal perfeitamente no meio do painel do servidor.
              - **Spacers Repetidos (`*spacer`):** Se o spacer começa com `*`, ele repete o caractere fornecido (ex.: `-` ou `=`) por toda a largura do painel para criar uma linha sólida divisória!
              - **Bloqueio de Acesso:** Canais do tipo spacer são marcados como desabilitados, impedindo que usuários entrem ou cliquem neles, servindo estritamente para organização visual.

            ### 🏷️ Suporte a Tags/Siglas de Cargos Integradas (Client & Server)
            * **Exibição Hierárquica:** O `ServerTreeWidget::addUserItem` agora processa a sigla do cargo enviada pelo Halla Server v3.2.1 e **exibe automaticamente antes do nome do usuário conectado** (ex.: `[Admin] Farley Barbosa`), oferecendo maior nível de prestígio e visualização de hierarquia de moderadores!

            ### 🌐 Suporte Internacional Integrado (Português, Inglês e Espanhol)
            * **Detecção Automática:** Ao inicializar o aplicativo, ele detecta automaticamente o idioma padrão do seu sistema operacional (`QLocale::system()`).
            * **Tradução Dinâmica On-the-Fly:** Todo o aplicativo se traduz dinamicamente para o **Inglês** ou **Espanhol** caso seu computador esteja configurado em um desses idiomas, de forma extremamente leve e sem necessidade de arquivos externos adicionais!

            ### 🔄 Fechamento Instantâneo para Atualizações Automáticas (Instalação Sem Avisos)
            * **Forçar Saída Limpa:** Ao concluir o download da nova versão temporária, o app seta a flag de salvamento e encerramento forçado `S::set("app/forceQuit", true)`, o que permite que o Halla feche instantaneamente no mesmo milissegundo, **bypassando e silenciando por completo o popup de confirmação** (*Você ainda está conectado a servidores. Deseja realmente sair?*). O instalador roda em seguida de forma limpa, rápida e livre de qualquer erro de arquivo em uso!

            ### 🎧 Lógica Automatizada de Silenciamento (Auto-Mute Microfone)
            * **Fones/Microfone em Sincronia:** Ao silenciar os fones de ouvido (alto-falantes), o microfone agora é silenciado automaticamente também! Da mesma forma, ao reativar os fones, o microfone é reativado perfeitamente.

            ### 📊 Diálogo de Informações de Conexão do Servidor
            * Painel informativo sob o menu *Conexões* que exibe o Uptime, Ping dinâmico, Clientes conectados, plataforma, versão e IP do servidor.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
