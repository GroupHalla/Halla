name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-speech

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="/mingw64" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Prepare Distribution
        shell: msys2 {0}
        run: |
          mkdir -p dist/Halla
          cp build/Halla.exe dist/Halla/
          
          # Deploy Qt dependencies using MSYS2's native windeployqt
          windeployqt --release --no-translations --no-compiler-runtime --dir dist/Halla dist/Halla/Halla.exe
          
          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/Halla/
          cp /mingw64/bin/libstdc++-6.dll dist/Halla/
          cp /mingw64/bin/libwinpthread-1.dll dist/Halla/
          
          # Recursively resolve and copy ALL DLL dependencies from /mingw64/bin!
          # This guarantees libbrotlidec, zlib1, libb2, libicuin, and any other system-provided libraries are included!
          echo ">> Resolvendo e copiando dependências recursivas de DLLs do sistema..."
          COPIED=true
          while [ "$COPIED" = true ]; do
            COPIED=false
            for f in $(find dist/Halla -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dep in $(ldd "$f" | grep -i "mingw" | awk '{print $3}'); do
                if [ ! -z "$dep" ]; then
                  dep_unix=$(cygpath -u "$dep" 2>/dev/null || echo "$dep")
                  dep_name=$(basename "$dep_unix")
                  if [ ! -f "dist/Halla/$dep_name" ] && [ -f "$dep_unix" ]; then
                    echo "Copiando dependência encontrada: $dep_name de $dep_unix"
                    cp "$dep_unix" dist/Halla/
                    COPIED=true
                  fi
                fi
              done
            done
          done
          
          # Copy Readme and License
          cp packaging/LEIA-ME.txt dist/Halla/
          cp packaging/LICENSE.txt dist/Halla/

      - name: Install NSIS
        run: choco install nsis

      - name: Build Installer with NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging/halla-setup.nsi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.13.4
          name: Halla v3.13.4
          draft: false
          prerelease: false
          files: Halla-Setup-3.13.4.exe
          body: |
            ## 🚀 Novidades e Correções do Halla v3.13.4

            Esta release traz o polimento visual definitivo e a correção de bugs críticos para oferecer uma experiência de áudio idêntica ao TeamSpeak 3!

            ### ⌨️ Captura Perfeita de PTT e Atalhos pelo Mouse (Middle / 4 / 5)
            * **Visibilidade Garantida:** Corrigimos o foco e a visibilidade do capturador de atalhos dentro do diálogo modal. Agora o gancho global de baixo nível (Windows Hook / NativeCapture) é corretamente armado e ativado.
            * **Múltiplos Meios de Captura:** O usuário pode capturar qualquer tecla do teclado ou os botões extras do mouse (`Mouse 4`, `Mouse 5` e `MouseMeio`) seja focando o campo central ou simplesmente **clicando com o botão do mouse em qualquer lugar dentro da janela modal**!
            * **Tecla ESC:** Mantivemos o clássico atalho de cancelar a captura pressionando a tecla `ESC`.

            ### 🎨 Refatoração Definitiva e Alinhamento da Barra de Ferramentas
            * **Remoção de Linhas Divisórias Internas:** Eliminamos a borda cinza escura interna dos botões com menu suspenso.
            * **Área de Clique em Bloco Sólido:** Os botões com dropdown (`Desconectar`, `Mutar Fones`, etc.) agora têm a largura dimensionada de forma dinâmica e fluida (sem sobreposição do ícone com a seta preta). O efeito visual de hover e o clique englobam o ícone e a seta como um único bloco sólido.
            * **Divisórias Externas Nativas:** A divisória 3D etched (`Q3DSeparator`) agora é renderizada de forma completamente autônoma do lado de fora dos botões, organizando a barra sem invadir as áreas clicáveis.

            ### 🎙️ Correção Instantânea do Indicador de Transmissão (Círculo Verde)
            * **Ignore Echoes:** O estado de fala local (`talking`) do próprio usuário agora é regulado de forma instantânea e estrita pelo sinal do motor de voz físico (`VoiceEngine::talkingChanged`), ignorando ecos atrasados enviados pelo servidor. O círculo verde ao redor do seu avatar apaga exatamente no mesmo milissegundo em que você solta a tecla de PTT!

            ### 🎛️ Liberação das Placas de Áudio e Microfones
            * **Menu Desbloqueado:** Corrigimos a trava que mantinha a seleção de dispositivos de áudio desabilitada e presa em "Padrão" nas configurações de Captura e Reprodução.
            * **Identificadores de Hardware Reais:** O aplicativo agora lê e mapeia dinamicamente todos os seus microfones, headsets e placas de som, aplicando-os em tempo real ao motor de voz!

            ### 🔄 Sistema de Atualização Automática Integrado
            * O Halla agora busca silenciosamente novas atualizações diretamente nas Releases do GitHub e exibe um prompt com barra de porcentagem de download e instalação automatizada!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
