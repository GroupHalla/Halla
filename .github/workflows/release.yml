name: CI Windows MinGW fallback

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-speech
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-opus
      - name: Validate repository policy
        run: python tests/repo_sanity.py
      - name: Configure fallback build
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=/mingw64 -DCMAKE_BUILD_TYPE=Release -DHALLA_ENABLE_WEBRTC_NATIVE=OFF
      - name: Build fallback client
        shell: msys2 {0}
        run: cmake --build build --verbose
      # O binário distribuído é exatamente este build "fallback": sem SDK do
      # libwebrtc, o DSP de voz vem do código embutido (RNNoise + AEC do
      # speex). Este gate garante que o processamento de sinal REALMENTE
      # funciona — os checkboxes de redução de ruído/eco já foram no-op no
      # passado e ninguém notou até chegar no usuário.
      - name: DSP fallback smoke (RNNoise + speex AEC)
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p build/dsp
          for f in denoise kiss_fft pitch celt_lpc rnn rnn_data; do
            gcc -O2 -c -I src/audio/rnnoise "src/audio/rnnoise/$f.c" -o "build/dsp/$f.o"
          done
          gcc -O2 -c -I src/audio/rnnoise -I src/audio/speex_aec \
              src/audio/speex_aec/speex_aec.c -o build/dsp/speex_aec.o
          g++ -O2 -std=c++17 \
              -I /mingw64/include/qt6 -I /mingw64/include/qt6/QtCore \
              -I src tests/dsp_fallback_smoke.cpp src/audio/HallaAudioProcessing.cpp \
              build/dsp/*.o -lm -o build/dsp_smoke.exe
          ./build/dsp_smoke.exe
