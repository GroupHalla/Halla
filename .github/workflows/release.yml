name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-speech

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="/mingw64" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Prepare Distribution
        shell: msys2 {0}
        run: |
          mkdir -p dist/Halla
          cp build/Halla.exe dist/Halla/
          
          # Deploy Qt dependencies using MSYS2's native windeployqt
          windeployqt --release --no-translations --no-compiler-runtime --dir dist/Halla dist/Halla/Halla.exe
          
          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/Halla/
          cp /mingw64/bin/libstdc++-6.dll dist/Halla/
          cp /mingw64/bin/libwinpthread-1.dll dist/Halla/
          
          # Recursively resolve and copy ALL DLL dependencies from /mingw64/bin!
          # This guarantees libbrotlidec, zlib1, libb2, libicuin, and any other system-provided libraries are included!
          echo ">> Resolvendo e copiando dependências recursivas de DLLs do sistema..."
          COPIED=true
          while [ "$COPIED" = true ]; do
            COPIED=false
            for f in $(find dist/Halla -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dep in $(ldd "$f" | grep -i "mingw" | awk '{print $3}'); do
                if [ ! -z "$dep" ]; then
                  dep_unix=$(cygpath -u "$dep" 2>/dev/null || echo "$dep")
                  dep_name=$(basename "$dep_unix")
                  if [ ! -f "dist/Halla/$dep_name" ] && [ -f "$dep_unix" ]; then
                    echo "Copiando dependência encontrada: $dep_name de $dep_unix"
                    cp "$dep_unix" dist/Halla/
                    COPIED=true
                  fi
                fi
              done
            done
          done
          
          # Copy Readme and License
          cp packaging/LEIA-ME.txt dist/Halla/
          cp packaging/LICENSE.txt dist/Halla/

      - name: Install NSIS
        run: choco install nsis

      - name: Build Installer with NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging/halla-setup.nsi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.13.7
          name: Halla v3.13.7
          draft: false
          prerelease: false
          files: Halla-Setup-3.13.7.exe
          body: |
            ## 🚀 Novidades e Correções do Halla v3.13.7

            Esta release traz a simplificação e robustez definitiva para a captura de atalhos/PTT inline direta (sem diálogos modais de travamento), além do polimento completo da UI!

            ### ⌨️ Captura de Atalhos Direct-Inline Ultra Fluida (Sem Modais)
            * **Remoção da Modal de Captura:** Removemos a mini-janela/diálogo modal de captura e todos os hooks globais de baixo nível (`WH_MOUSE_LL` / `WH_KEYBOARD_LL`) que causavam conflitos com o loop de mensagens do Windows em algumas máquinas, eliminando completamente qualquer travamento ou congelamento (freeze/crash)!
            * **Foco e Captura Direta:** Agora, o campo de atalho funciona em modo de captura inline diretamente focado. Basta clicar no campo de texto para focá-lo/armá-lo, pressionar a tecla ou botão lateral do mouse (`Mouse 4`, `Mouse 5` ou `MouseMeio`) que o atalho é capturado instantaneamente!
            * **Desarme Automático Snappy:** No exato momento em que o atalho é capturado, o widget chama automaticamente `clearFocus()` para desarmar a captura de forma ultra rápida e devolver o comportamento normal do teclado/mouse de forma 100% segura e leve!

            ### 🎨 Barra de Ferramentas e UI no Padrão TS3 Clássico
            * Botões com dropdown se auto-ajustam ao tamanho do ícone + seta com espaçamento elegante.
            * O efeito visual de hover e o clique cobrem todo o botão como um bloco sólido indivisível.
            * Separadores 3D etched independentes que separam visualmente os grupos de botões.

            ### 🎙️ Outras Melhorias Robustas
            * **Círculo Verde de Fala Instantâneo:** O indicador de fala responde 100% à tecla de PTT do usuário sem sofrer atrasos ou ficar "preso" por ecos de rede do servidor.
            * **Mapeamento de Hardware de Áudio:** Menus de captura e reprodução totalmente habilitados, permitindo que você selecione e alterne microfones e headsets de verdade!
            * **Atualização Automática:** O aplicativo busca atualizações silenciosamente no GitHub e atualiza a si mesmo de forma autônoma com barra de progresso!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
