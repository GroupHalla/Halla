name: WebRTC Native Smoke Test

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Halla-WebRTC-Builds release tag'
        required: true
        default: 'v0.1.3'

permissions:
  contents: read

jobs:
  windows-native-smoke:
    name: Windows x64 native WebRTC link smoke
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-speech
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-opus

      - name: Download Halla WebRTC SDK
        shell: pwsh
        env:
          SDK_TOKEN: ${{ secrets.HALLA_WEBRTC_SDK_TOKEN }}
          SDK_VERSION: ${{ github.event.inputs.sdk_version }}
        run: |
          if (-not $env:SDK_TOKEN) { throw "Missing secret HALLA_WEBRTC_SDK_TOKEN" }
          $url = "https://github.com/GroupHalla/Halla-WebRTC-Builds/releases/download/$env:SDK_VERSION/halla-webrtc-windows-x64-$env:SDK_VERSION.zip"
          New-Item -ItemType Directory -Force third_party/webrtc-sdk | Out-Null
          Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:SDK_TOKEN" } -Uri $url -OutFile webrtc-sdk.zip
          Expand-Archive -Path webrtc-sdk.zip -DestinationPath third_party/webrtc-sdk -Force
          Get-ChildItem third_party/webrtc-sdk -Recurse | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName }

      - name: Configure CMake with native WebRTC ON
        shell: msys2 {0}
        run: |
          cmake -S . -B build-webrtc -G "Ninja" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="/mingw64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DHALLA_WEBRTC_SDK_DIR="$PWD/third_party/webrtc-sdk" \
            -DHALLA_ENABLE_WEBRTC_NATIVE=ON

      - name: Build Halla with native WebRTC ON
        shell: msys2 {0}
        run: cmake --build build-webrtc --verbose
